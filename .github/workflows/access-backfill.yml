name: Access control v2 -- bootstrap / backfill on EC2

# One-off (and safe to repeat) data step after migrations 089-091:
#   bootstrap : register the MIS capability manifest, seed presets and default
#               auto-assignment rules (insert-only; also runs on every boot)
#   backfill  : turn today's global UserRole rows into grants and run the
#               auto-assignment rules over existing placements. Dry run by
#               default -- read the report, then run again with apply=true.
# See ACCESS_LEVELS_RBAC_IMPLEMENTATION_PLAN.md §16.5.
on:
  workflow_dispatch:
    inputs:
      command:
        description: "bootstrap | backfill | sync-rules"
        required: true
        default: backfill
        type: choice
        options: [bootstrap, backfill, sync-rules]
      apply:
        description: "Write changes (backfill only). Leave false for a dry run."
        required: true
        default: false
        type: boolean

jobs:
  access:
    runs-on: ubuntu-latest
    steps:
      - name: Run access CLI over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ACCESS_COMMAND: ${{ inputs.command }}
          ACCESS_APPLY: ${{ inputs.apply }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ACCESS_COMMAND,ACCESS_APPLY
          script: |
            set -e
            cd /opt/apps/nga_central_mis/backend
            test -f dist/access/cli.js || { echo "dist/access/cli.js missing -- deploy the access v2 code first."; exit 1; }
            FLAG=""
            if [ "$ACCESS_COMMAND" = "backfill" ] && [ "$ACCESS_APPLY" = "true" ]; then FLAG="--apply"; fi
            echo "node dist/access/cli.js $ACCESS_COMMAND $FLAG"
            node dist/access/cli.js "$ACCESS_COMMAND" $FLAG
