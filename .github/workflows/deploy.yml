name: Deploy nga_central_mis to EC2

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The EC2 box is too memory-constrained to run `vite build` in place
      # (JS heap OOM), so the frontend is built here on the runner instead
      # and only the compiled dist/ is shipped over.
      - name: Build frontend
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm ci
          npm run build

      - name: Deploy backend over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /opt/apps/nga_central_mis

            git fetch origin main
            git reset --hard origin/main

            # Puppeteer (PDF export) uses the system Chrome (installed once,
            # manually, on this box) instead of its own bundled download,
            # which was failing here. See DEPLOYMENT notes.
            cd backend
            cp .env.production .env
            export PUPPETEER_SKIP_DOWNLOAD=true
            npm ci
            npm run build
            npm prune --omit=dev
            # DB schema changes are applied manually (see DEPLOYMENT notes) — not auto-run here.

            pm2 restart mis-backend --update-env || pm2 start dist/index.js --name mis-backend --update-env
            pm2 save
            cd ..

      - name: Upload frontend build
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            frontend/dist/ "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/apps/nga_central_mis/frontend/dist/"

      - name: Reload nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: sudo /usr/sbin/nginx -t && sudo systemctl reload nginx
