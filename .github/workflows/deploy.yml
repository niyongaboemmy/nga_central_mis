name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: rm -f package-lock.json && npm install --legacy-peer-deps

      - name: Build backend (TypeScript → dist/)
        working-directory: backend
        run: npm run build

      - name: Deploy backend files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./backend/
          server-dir: ngamis-api/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/src/**
            **/*.ts
            **/*.test.*
            **/uploads/**
            **/*.sql
            **/*.db
            **/*.sqlite
            **/drizzle/**
            **/temp/**
            **/test_*.js
            **/check_*.js
            **/diagnose*.js
            **/inspect*.js
            **/migrate_*.js
            **/full_extract.js

      - name: Install production deps & restart app via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSWORD }}
          port: 21098
          script: |
            cd ~/ngamis-api
            mkdir -p logs
            npm install --omit=dev
            which pm2 || npm install -g pm2
            pm2 restart ecosystem.config.js --env production || pm2 start ecosystem.config.js --env production
            pm2 save

  deploy-frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: https://ngamis.isengesho.com
          VITE_APP_NAME: NGA MIS
          VITE_APP_VERSION: 1.0.0
          VITE_WEBSITE_URL: https://nga.ac.rw

      - name: Deploy frontend files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FRONTEND_FTP_SERVER }}
          username: ${{ secrets.FRONTEND_FTP_USERNAME }}
          password: ${{ secrets.FRONTEND_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./frontend/dist/
          server-dir: /
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
