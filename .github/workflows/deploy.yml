name: Deploy nga_central_mis to EC2

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /opt/apps/nga_central_mis

            git fetch origin main
            git reset --hard origin/main

            # Puppeteer (PDF export) uses the system Chrome instead of its own
            # bundled download, which was failing to install on this box.
            if ! command -v google-chrome-stable >/dev/null 2>&1; then
              wget -q -O /tmp/google-chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
              sudo apt-get update -y
              sudo apt-get install -y /tmp/google-chrome.deb
              rm -f /tmp/google-chrome.deb
            fi

            cd backend
            cp .env.production .env
            export PUPPETEER_SKIP_DOWNLOAD=true
            npm ci
            npm run build
            npm prune --omit=dev
            # DB schema changes are applied manually (see DEPLOYMENT notes) — not auto-run here.
            cd ..

            cd frontend
            npm ci
            npm run build
            cd ..

            pm2 restart mis-backend --update-env
            sudo /usr/sbin/nginx -t && sudo systemctl reload nginx
