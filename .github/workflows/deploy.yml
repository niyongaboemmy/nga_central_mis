name: Deploy Backend to EC2

on:
  push:
    branches:
      - main 
    paths:
      - 'backend/**' # Only runs if you make changes to the backend

jobs:
  build-and-deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install and Build TypeScript
        working-directory: ./backend 
        run: |
          npm install
          npm run build # ACTIVE: This compiles your .ts files into .js files

      - name: Copy Files to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend/dist/,backend/package.json,backend/package-lock.json" 
          target: "/var/www" 
          strip_components: 1

      - name: Restart PM2 on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /var/www
            npm install --production
            pm2 restart mis
