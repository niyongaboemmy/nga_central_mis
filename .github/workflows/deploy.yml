name: Deploy nga_central_mis to EC2

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /opt/apps/nga_central_mis

            git fetch origin main
            git reset --hard origin/main

            cd backend
            npm ci
            npm run build
            npm prune --omit=dev
            # DB schema changes are applied manually (see DEPLOYMENT notes) — not auto-run here.
            cd ..

            cd frontend
            npm ci
            npm run build
            cd ..

            pm2 restart mis-backend --update-env
            sudo /usr/sbin/nginx -t && sudo systemctl reload nginx
