name: Deploy nga_central_mis to EC2

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The EC2 box is too memory-constrained to run `vite build` in place
      # (JS heap OOM), so the frontend is built here on the runner instead
      # and only the compiled dist/ is shipped over.
      - name: Build frontend
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # The committed frontend/.env still has the localhost dev API URL
          # (see DEPLOYMENT notes) and Vite loads .env before .env.production,
          # so the production value must win here to avoid shipping a build
          # that calls localhost:5001 in the browser.
          VITE_API_BASE_URL: https://api.amashuri.com
          VITE_APP_NAME: NGA Central MIS
          VITE_APP_VERSION: 1.0.0
          VITE_WEBSITE_URL: https://amashuri.com
          VITE_GOOGLE_CLIENT_ID: 913204130540-5hrfp5ridotig5ebd7ar424vhecq8bab.apps.googleusercontent.com
        run: |
          npm ci
          npm run build

      - name: Deploy backend over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /opt/apps/nga_central_mis

            git fetch origin main
            git reset --hard origin/main

            # Puppeteer (PDF export) uses the system Chrome (installed once,
            # manually, on this box) instead of its own bundled download,
            # which was failing here. See DEPLOYMENT notes.
            cd backend
            cp .env.production .env
            export PUPPETEER_SKIP_DOWNLOAD=true
            npm ci

            # Applies migration 071 (adds DOCX_IMPORT_AI to SchemeOfWork.source, needed for the
            # DOCX-import AI-extraction fallback) if this environment doesn't have it yet.
            # Deliberately scoped to just this one file, checked idempotently, rather than a
            # generic "run everything in migrations/ not yet applied" step: the other 70+ files in
            # this repo were applied by hand over time with no tracking table, so a blanket runner
            # tries to replay all of them from scratch and fails on the first one that already
            # exists. Revisit with a proper tracking table (seeded against actual prod state)
            # before automating migrations more broadly.
            # Read just the 4 DB values straight out of .env rather than sourcing the whole file:
            # sourcing it (even with `set -a; ... ; set +a`) exports EVERYTHING in .env.production
            # -- including e.g. NODE_ENV=production -- into every command for the rest of this
            # script, which broke the unrelated file-server `npm ci` below (silently skips
            # devDependencies, so `tsc` goes missing). Plain grep avoids that entirely, and also
            # sidesteps .env.production's unrelated unquoted-value "command not found" line.
            migration_db_val() { grep -E "^$1=" .env | tail -1 | cut -d= -f2- | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//"; }
            MIGRATION_DB_HOST=$(migration_db_val DB_HOST)
            MIGRATION_DB_USERNAME=$(migration_db_val DB_USERNAME)
            MIGRATION_DB_PASSWORD=$(migration_db_val DB_PASSWORD)
            MIGRATION_DB_NAME=$(migration_db_val DB_NAME)
            if ! mysql -h "$MIGRATION_DB_HOST" -u "$MIGRATION_DB_USERNAME" -p"$MIGRATION_DB_PASSWORD" "$MIGRATION_DB_NAME" -e "SHOW COLUMNS FROM SchemeOfWork LIKE 'source';" | grep -q "DOCX_IMPORT_AI"; then
              echo "Applying migration 071 (SchemeOfWork.source: DOCX_IMPORT_AI)..."
              mysql -h "$MIGRATION_DB_HOST" -u "$MIGRATION_DB_USERNAME" -p"$MIGRATION_DB_PASSWORD" "$MIGRATION_DB_NAME" < migrations/071_scheme_of_work_docx_import_ai_source.sql
            else
              echo "Migration 071 already applied, skipping."
            fi

            # Applies migration 072 (Notification + DocumentShareLink tables, and adds
            # DOWNLOAD to FolderPermission.permission_type) for the document-sharing
            # feature -- same idempotent, single-file pattern as migration 071 above.
            if ! mysql -h "$MIGRATION_DB_HOST" -u "$MIGRATION_DB_USERNAME" -p"$MIGRATION_DB_PASSWORD" "$MIGRATION_DB_NAME" -e "SHOW TABLES LIKE 'Notification';" | grep -q "Notification"; then
              echo "Applying migration 072 (Notification, DocumentShareLink, FolderPermission.DOWNLOAD)..."
              mysql -h "$MIGRATION_DB_HOST" -u "$MIGRATION_DB_USERNAME" -p"$MIGRATION_DB_PASSWORD" "$MIGRATION_DB_NAME" < migrations/072_document_sharing_and_notifications.sql
            else
              echo "Migration 072 already applied, skipping."
            fi

            npm run build
            npm prune --omit=dev

            pm2 restart mis-backend --update-env || pm2 start dist/index.js --name mis-backend --update-env
            pm2 save
            cd ..

            # Shared file storage service (used by both this app and
            # nga-task-mentor) -- see file-server/README for the API.
            cd file-server
            cp .env.production .env
            npm ci
            npm run build
            npm prune --omit=dev
            pm2 restart file-server --update-env || pm2 start dist/index.js --name file-server --update-env
            pm2 save
            cd ..

      - name: Upload frontend build
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            frontend/dist/ "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/apps/nga_central_mis/frontend/dist/"

      - name: Reload nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: sudo /usr/sbin/nginx -t && sudo systemctl reload nginx
