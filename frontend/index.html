<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="NGA Central Management Information System"
    />
    <title>NGA Central MIS</title>
    <script>
      // Redirect /public/mis/* to /mis/* before React loads
      (function () {
        var path = window.location.pathname;
        if (path.includes("/public/mis/")) {
          var newPath = path.replace("/public/mis", "/mis/");
          window.location.replace(newPath);
        }
      })();
    </script>
  </head>
  <body class="bg-gray-100 dark:bg-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
