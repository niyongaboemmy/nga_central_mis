<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Installable NGA app (REMINDERS_SOLUTION_PROPOSAL.md §7) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2f56d9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NGA" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="NGA Central Management Information System"
    />
    <title>NGA MIS - New Generation Academy</title>
    <!-- Typography: Inter (UI) + JetBrains Mono (Code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400;1,14..32,500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Redirect /public/mis/* to /mis/* before React loads
      (function () {
        var path = window.location.pathname;
        if (path.includes("/public/mis/")) {
          var newPath = path.replace("/public/mis", "/mis/");
          window.location.replace(newPath);
        }
      })();
    </script>
  </head>
  <body class="bg-gray-100 dark:bg-black">
    <!-- Server-rendered fallback, replaced by the app on load. It gives
         crawlers and Google's OAuth brand check a readable home page with
         links to the privacy policy and terms (they don't run the app). -->
    <div id="root">
      <main style="font-family:system-ui,sans-serif;max-width:640px;margin:15vh auto;padding:0 16px;text-align:center;color:#334155">
        <h1 style="font-size:1.5rem;color:#0f172a">NGA MIS · New Generation Academy</h1>
        <p>The school management system for New Generation Academy's students, parents, teachers and staff: timetables, learning, results, attendance and reminders.</p>
        <noscript><p>Please enable JavaScript to sign in.</p></noscript>
        <p style="font-size:14px"><a href="/privacy/">Privacy Policy</a> · <a href="/terms/">Terms of Service</a></p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
