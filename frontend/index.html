<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Installable NGA app (REMINDERS_SOLUTION_PROPOSAL.md §7) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2f56d9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NGA" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="NGA Central Management Information System"
    />
    <title>NGA MIS - New Generation Academy</title>
    <!-- Typography: Inter (UI) + JetBrains Mono (Code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400;1,14..32,500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Redirect /public/mis/* to /mis/* before React loads
      (function () {
        var path = window.location.pathname;
        if (path.includes("/public/mis/")) {
          var newPath = path.replace("/public/mis", "/mis/");
          window.location.replace(newPath);
        }
      })();
    </script>
  </head>
  <body class="bg-gray-100 dark:bg-black">
    <!-- First paint, before the app's JavaScript: a plain loading screen in the
         brand colours that stays until the app replaces it (React mounts into
         #root). The small footer keeps the privacy/terms links in the page
         for crawlers and Google's OAuth brand check. Styles are scoped under
         .ngl and removed with it. -->
    <div id="root">
      <style>
        .ngl{--bg:#f8fafc;--ink:#0f172a;--muted:#64748b;--track:#e2e8f0;--brand:#2f56d9;--brand2:#3b6cff;
          position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
          background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
        @media (prefers-color-scheme:dark){.ngl{--bg:#0b1220;--ink:#e2e8f0;--muted:#94a3b8;--track:#1e293b}}
        .ngl img{width:72px;height:72px;border-radius:20px;animation:ngl-breathe 1.8s ease-in-out infinite}
        .ngl-bar{width:140px;height:4px;border-radius:99px;background:var(--track);overflow:hidden}
        .ngl-bar::after{content:"";display:block;width:40%;height:100%;border-radius:99px;background:var(--brand);animation:ngl-load 1.1s ease-in-out infinite}
        .ngl p{margin:0;font-size:14px;font-weight:600;color:var(--muted)}
        .ngl nav{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;gap:14px;font-size:12px}
        .ngl nav a{color:var(--muted);text-decoration:none}
        .ngl nav a:hover{color:var(--brand2)}
        @keyframes ngl-load{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
        @keyframes ngl-breathe{50%{transform:scale(1.04)}}
        @media (prefers-reduced-motion:reduce){.ngl img,.ngl-bar::after{animation:none}}
      </style>
      <main class="ngl" aria-busy="true" aria-label="Loading NGA MIS">
        <img src="/android-chrome-512x512.png" alt="NGA MIS" />
        <div class="ngl-bar" role="progressbar" aria-label="Loading"></div>
        <p>Loading NGA MIS…</p>
        <noscript><p>Please enable JavaScript to use NGA MIS.</p></noscript>
        <nav aria-label="Legal"><a href="/privacy/">Privacy Policy</a><a href="/terms/">Terms of Service</a></nav>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
