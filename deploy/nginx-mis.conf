# nga_central_mis — nginx server blocks
# Copy to /etc/nginx/sites-available/mis.conf then:
#   sudo ln -s /etc/nginx/sites-available/mis.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Run certbot afterwards to fill in the SSL directives automatically:
#   sudo certbot --nginx -d mis.amashuri.com -d api.amashuri.com -d amashuri.com

# apex -> redirect to mis subdomain
server {
    listen 80;
    server_name amashuri.com www.amashuri.com;
    return 301 https://mis.amashuri.com$request_uri;
}

# Frontend (static build)
server {
    listen 80;
    server_name mis.amashuri.com;

    root /opt/apps/nga_central_mis/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

# Backend API
server {
    listen 80;
    server_name api.amashuri.com;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
