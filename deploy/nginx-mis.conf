# nga_central_mis — nginx server blocks
# Copy to /etc/nginx/sites-available/mis.conf then:
#   sudo ln -s /etc/nginx/sites-available/mis.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Run certbot afterwards to fill in the SSL directives automatically:
#   sudo certbot --nginx -d mis.amashuri.com -d api.amashuri.com -d amashuri.com -d cdn.amashuri.com

# apex -> redirect to mis subdomain
server {
    listen 80;
    server_name amashuri.com www.amashuri.com;
    return 301 https://mis.amashuri.com$request_uri;
}

# Frontend (static build)
server {
    listen 80;
    server_name mis.amashuri.com;

    root /opt/apps/nga_central_mis/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

# Backend API
server {
    listen 80;
    server_name api.amashuri.com;

    # Was 25m -- lower than the app's own upload limits (e.g. 50MB on subject
    # documents), so nginx was 413-ing uploads that the backend would have
    # accepted. 5g matches the app-level cap (MAX_SUBJECT_DOCUMENT_SIZE in
    # backend/src/routes/curriculum.ts) so this never becomes the binding limit.
    client_max_body_size 5g;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Default 4-8k buffer is too small for this API's response headers
        # (large Set-Cookie on auth routes) -- nginx was truncating them and
        # returning 502 "upstream sent too big header" instead of proxying.
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 32k;
        # Large uploads on a slow connection can take a while -- nginx's
        # default 60s send/read timeout was aborting them mid-transfer.
        client_body_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
}

# File server (internal file management service, shared by nga_central_mis
# and nga-task-mentor). Still requires the X-API-Key header the service
# itself enforces -- exposing this publicly doesn't weaken that, it's just
# a reachable address for it rather than only 127.0.0.1.
server {
    listen 80;
    server_name cdn.amashuri.com;

    # Matches the file-server's own default MAX_FILE_SIZE (5GB); see
    # api.amashuri.com above for why a tighter cap here would just move the
    # same 413 problem to this hop.
    client_max_body_size 5g;

    location / {
        proxy_pass http://127.0.0.1:5004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 32k;
        client_body_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
}
